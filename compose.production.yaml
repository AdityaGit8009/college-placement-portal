services:
  app:
    environment:
      APP_ENV: production
      DEMO_PASSWORD: ''
  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
